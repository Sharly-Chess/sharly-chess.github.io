# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Workflow for building the THP site with optional beta docs and deploying it to
# thp.sharly-chess.com on Vercel
name: Deploy THP site

on:
  # Runs on pushes to main or beta branches
  push:
    branches: ["main", "beta"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "thp-site"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: macos-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Build main version (root)
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
      
      - name: Setup Ruby for main
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          working-directory: main-site
          bundler-cache: true
      
      - name: Build main site
        run: |
          cd main-site
          bundle exec jekyll build --destination ../_site/
        env:
          JEKYLL_ENV: production
      
      # Check if beta branch exists and build it
      - name: Check if beta branch exists
        id: check-beta
        continue-on-error: true
        run: |
          cd main-site
          if git ls-remote --exit-code --heads origin beta > /dev/null 2>&1; then
            echo "beta_exists=true" >> $GITHUB_OUTPUT
            echo "Beta branch exists, will build beta docs"
          else
            echo "beta_exists=false" >> $GITHUB_OUTPUT
            echo "Beta branch does not exist, skipping beta docs"
          fi
      
      - name: Checkout beta branch
        if: steps.check-beta.outputs.beta_exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-site
      
      - name: Setup Ruby for beta
        if: steps.check-beta.outputs.beta_exists == 'true'
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          working-directory: beta-site
          bundler-cache: true
      
      - name: Configure beta for subdirectory
        if: steps.check-beta.outputs.beta_exists == 'true'
        run: |
          cd beta-site
          # Update baseurl for subdirectory deployment
          sed -i '' 's|baseurl: ""|baseurl: "/beta"|' _config.yml
      
      - name: Build beta site
        if: steps.check-beta.outputs.beta_exists == 'true'
        run: |
          cd beta-site
          bundle exec jekyll build --destination ../_site/beta/
        env:
          JEKYLL_ENV: production

      - name: Deploy thp.sharly-chess.com to Vercel
        run: |
          cp main-site/.github/vercel-thp.json _site/vercel.json
          npx --yes vercel@65.2.0 deploy _site --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: team_FTyOTBiO6bcYqLzBwWO4Ounb
          VERCEL_PROJECT_ID: prj_UQo9rBJ49YnR0lxVtAHrZmhAxFmv
