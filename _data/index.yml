description:
  en:
    - Free and open-source software for arbiters, to run your chess tournaments from check-in to final standings.
    - To find tournaments and register online, visit <a href="https://sharly-chess.com/en">sharly-chess.com</a>.
  fr:
    - Le logiciel gratuit et libre des arbitres, pour gérer vos tournois d'échecs du pointage jusqu'aux résultats.
    - Pour trouver des tournois et vous inscrire en ligne, rendez-vous sur <a href="https://sharly-chess.com/fr">sharly-chess.com</a>.
services:
  downloads_title:
    en: Download
    fr: Télécharger
  items:
    -
      downloads:
        - thp_download_platform: windows
        - thp_download_platform: macos
        - id: thp-install-linux-button
          logo: linux_logo.svg
          platform: Linux
          text:
            en: Install (Linux)
            fr: Installer (Linux)
          url:
            en: installation-linux/
            fr: installation-linux/
      buttons:
        - class: docs-button
          icon: bi-book
          text:
            en: Access the documentation
            fr: Accéder à la documentation
          url:
            en: getting-started/
            fr: bien-demarrer/
made_by:
  title:
    en: An arbitration application made for <em>arbiters</em>, by <em>arbiters</em>
    fr: Un logiciel d'arbitrage conçu par des <em>arbitres</em>, pour les <em>arbitres</em>
  text:
    en: Free, open-source, intuitive and designed for real-world tournaments.
    fr: Gratuit, open-source, intuitif et pensé pour les tournois du monde réel.
  screenshot:
    basename: app-pairings
    alt:
      en: The pairings of a round of a 581-player tournament in Sharly Chess
      fr: Les appariements d’une ronde d’un tournoi de 581 joueur·euses dans Sharly Chess
arbiters:
  title:
    en: <em>Arbiters</em> love it
    fr: Les <em>arbitres</em> l'adorent
  text:
    en: <em>Sharly Chess</em> is built around the needs of tournament arbiters, helping you stay organized and efficient even in high-pressure settings.
    fr: <em>Sharly Chess</em> est conçu autour des besoins des arbitres de tournois, pour vous aider à rester organisé·e et efficace, même sous pression.
  items:
    -
      icon: bi-wifi-off
      title:
        en: Works offline
        fr: Fonctionne hors ligne
      text:
        en: Your computer is the server, so no internet connection is needed. Screens, tablets and phones connect over the venue's local network.
        fr: Votre ordinateur est le serveur, aucune connexion Internet n’est nécessaire. Écrans, tablettes et téléphones se connectent au réseau local de la salle.
    -
      icon: bi-patch-check
      title:
        en: FIDE compliant
        fr: Conforme FIDE
      text:
        en: FIDE Dutch and Team Swiss pairings, every FIDE tie-break, title norms and TRF26 reports. FIDE mode refuses what the rules forbid and logs every exception.
        fr: Appariements suisses FIDE, individuels et par équipes, tous les départages FIDE, normes de titres et rapports TRF26. Le mode FIDE refuse ce que les règles interdisent et consigne chaque exception.
    -
      icon: bi-diagram-3
      title:
        en: Every format
        fr: Tous les systèmes
      text:
        en: Swiss, round robin, knock-out and Keizer, for players and for teams, plus Scheveningen, Molter tables and accelerated pairings.
        fr: Suisse, toutes-rondes, coupe et Keizer, en individuel comme par équipes, ainsi que Scheveningen, tables Molter et appariements accélérés.
    -
      icon: bi-phone
      title:
        en: Players lend a hand
        fr: Les joueur·euses s’en chargent
      text:
        en: Players check in and enter their results from tablets or their own phone, and follow pairings and standings on live screens.
        fr: Les joueur·euses se pointent et saisissent leurs résultats sur tablette ou sur leur téléphone, et suivent appariements et classements sur des écrans en direct.
    -
      icon: bi-trophy
      title:
        en: Prizes, norms and championships
        fr: Prix, normes et championnats
      text:
        en: Prize lists calculated and shared automatically, FIDE title norms detected with their reports, and championships ranked across tournaments.
        fr: Palmarès calculés et partagés automatiquement, normes de titres FIDE détectées avec leurs rapports, et championnats classés sur plusieurs tournois.
    -
      icon: bi-globe2
      title:
        en: Online when you want it
        fr: En ligne quand vous le voulez
      text:
        en: With <a href="https://sharly-chess.com/en">sharly-chess.com</a>, players register, pay and check in online, and follow pairings and results live. Results can also be published on Chess-Results.com.
        fr: Avec <a href="https://sharly-chess.com/fr">sharly-chess.com</a>, les joueur·euses s’inscrivent, paient et se pointent en ligne, et suivent appariements et résultats en direct. Les résultats peuvent aussi être publiés sur Chess-Results.com.
  diagram:
    title:
      en: The chief arbiter's computer runs the server; screens, tablets and the other arbiters' computers and phones connect to it over the local network, and the results go live online
      fr: L’ordinateur de l’arbitre principal fait office de serveur ; écrans, tablettes, ordinateurs et téléphones des autres arbitres s’y connectent par le réseau local, et les résultats sont publiés en direct en ligne
    server:
      en: The chief arbiter's computer
      fr: L’ordinateur de l’arbitre principal
    screens:
      en: Live screens
      fr: Écrans en direct
    tablets:
      en: [Result entry, on tablets or computers]
      fr: [Saisie des résultats, sur tablettes ou ordinateurs]
    arbiters:
      en: [Privileged access for the arbiting team, from a computer or phone]
      fr: [Accès privilégié pour l’équipe d’arbitrage, depuis un ordinateur ou un téléphone]
    network:
      en: Local network, wired or Wi-Fi
      fr: Réseau local, filaire ou Wi-Fi
    cloud:
      en: Live results
      fr: Résultats en direct
