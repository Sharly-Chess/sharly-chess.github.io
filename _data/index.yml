players:
  title:
    en: <em>Players</em> love it
    fr: Les <em>joueur·euses</em> l'adorent
  text:
    en: <em>Sharly Chess</em> improves the tournament experience for everyone. Players can find their pairings quickly and submit results with ease.
    fr: <em>Sharly Chess</em> améliore l’expérience des tournois pour tout le monde. Les joueur·euses trouvent facilement leurs appariements et peuvent saisir leurs résultats en un clin d’œil.
  items:
    -
      device: tablet
      basename: app-result-entry
      title:
        en: Results entered by the players
        fr: Résultats saisis par les joueur·euses
      text:
        en: At the end of their game, players enter the result on a tablet. Less waiting between rounds, and the arbiter only checks.
        fr: À la fin de leur partie, les joueur·euses saisissent le résultat sur une tablette. Moins d’attente entre les rondes, et l’arbitre n’a plus qu’à vérifier.
    -
      device: screen
      basename: app-screen
      title:
        en: Pairings on screen
        fr: Appariements à l’écran
      text:
        en: Players find their board and opponent at a glance, and follow the results and standings live.
        fr: Les joueur·euses trouvent leur table et leur adversaire d’un coup d’œil, et suivent résultats et classements en direct.
