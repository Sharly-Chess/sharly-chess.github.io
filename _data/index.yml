      fr: Chaque club et organisateur·ice qui prend des inscriptions payantes sur <a href="https://sharly-chess.com/fr">sharly-chess.com</a> soutient aussi le projet.
    feed_url: https://sharly-chess.com/api/organizers
    page_url:
      en: https://sharly-chess.com/en/o/
      fr: https://sharly-chess.com/fr/o/
